                    this.width = 32;
                    this.height = 56;
                    this.vx = 0;
                    this.vy = 0;
                    this.facing = 1;
                    this.hp = PLAYER_MAX_HP;
                    this.maxHp = PLAYER_MAX_HP;
                    this.alive = true;
                    this.grounded = false;
                    this.rolling = false;
                    this.rollTimer = 0;
                    this.invincible = 0;
                    this.animPhase = 0;
                    this.weaponType = 'NORMAL';
                    this.weaponTimer = 0;
                    this.bulletSpeed = BULLET_SPEED_NORMAL;
                    this.bombs = 1;
                    this.shootCooldown = 0;
                    this.spreadShot = false;
                    this.rapidFire = false;
                    this.fastBullets = false;
                    this.doubleShot = false;
                    this.running = false;
                }
                update(platforms) {
                    this.animPhase += 0.12;
                    if (this.invincible > 0) this.invincible--;
                    if (this.weaponTimer > 0) {
                        this.weaponTimer--;
                        if (this.weaponTimer <= 0) this.resetWeapon();
                    }
                    if (this.shootCooldown > 0) this.shootCooldown--;
                    if (this.rolling) {
                        this.rollTimer--;
                        this.vx = this.facing * ROLL_SPEED;
                        this.vy = 0;
                        if (this.rollTimer <= 0) {
                            this.rolling = false;
                            this.invincible = ROLL_INVINCIBILITY;
                        }
                    } else {
                        this.vx = 0;
                        if (isLeft()) { this.vx = -PLAYER_SPEED;
                            this.facing = -1;
                            this.running = true; } else if (isRight()) { this.vx = PLAYER_SPEED;
                            this.facing = 1;
                            this.running = true; } else { this.running = false; }
                        if (isUp() && this.grounded) {
                            this.vy = PLAYER_JUMP;
                            this.grounded = false;
                            playSound('jump');
                        }
                    }
                    this.vy += GRAVITY;
                    this.y += this.vy;
                    this.grounded = false;
                    for (const p of platforms) {
                        if (this.vy > 0 && this.y + this.height / 2 > p.y && this.y + this.height / 2 < p.y + p.h +
                            12 &&
                            this.x > p.x - this.width / 2 && this.x < p.x + p.w + this.width / 2) {
                            this.y = p.y - this.height / 2;
                            this.vy = 0;
                            this.grounded = true;
                        }
                    }
                    if (this.y + this.height / 2 > GROUND_Y) {
                        this.y = GROUND_Y - this.height / 2;
                        this.vy = 0;
                        this.grounded = true;
                    }
                    if (this.y < -200) this.y = -200;
                    this.x += this.vx;
                    for (const p of platforms) {
                        const hb = this.getHitbox();
                        if (hb.x < p.x + p.w && hb.x + hb.w > p.x && hb.y < p.y + p.h && hb.y + hb.h > p.y) {
                            if (this.vx > 0) { this.x = p.x - this.width / 2;
                                this.vx = 0; } else if (this.vx < 0) { this.x = p.x + p.w + this.width / 2;
                                this.vx = 0; }
                        }
                    }
                    this.x = Math.max(20, Math.min(3980, this.x));
                    if (isShoot() && this.shootCooldown <= 0) {
                        this.shoot();
                        this.shootCooldown = this.rapidFire ? 100 : 180;
                    }
                    if (isRoll() && !this.rolling && Date.now() - lastRollTime > ROLL_COOLDOWN) {
                        this.rolling = true;
                        this.rollTimer = ROLL_DURATION;
                        this.invincible = ROLL_DURATION + 50;
                        lastRollTime = Date.now();
                        playSound('roll');
                    }
                    if (isBomb() && this.bombs > 0 && Date.now() - lastBombTime > BOMB_COOLDOWN) {
                        this.throwBomb();
                        lastBombTime = Date.now();
                    }
                }
                shoot() {
                    const now = Date.now();
                    if (now - lastShootTime < 50) return;
                    lastShootTime = now;
                    const bx = this.x + this.facing * 16;
                    const by = this.y - 5;
                    let spd = this.bulletSpeed;
                    if (this.fastBullets) spd = BULLET_SPEED_FAST;
                    if (this.spreadShot) {
                        for (let i = -1; i <= 1; i++) {
                            const angle = i * 0.3;
                            const vx = Math.cos(angle) * spd * this.facing;
                            const vy = Math.sin(angle) * spd;
                            projectiles.push(new Projectile(bx, by, vx, vy, true, 1, '#ffdd00', 3));
                        }
                    } else if (this.doubleShot) {
                        projectiles.push(new Projectile(bx, by - 5, this.facing * spd, 0, true, 1, '#ffdd00', 3));
                        projectiles.push(new Projectile(bx, by + 5, this.facing * spd, 0, true, 1, '#ffdd00', 3));
                    } else {
                        projectiles.push(new Projectile(bx, by, this.facing * spd, 0, true, 1, '#ffdd00', 3));
                    }
                    playSound('shoot');
                    spawnParticles(bx + this.facing * 5, by, 3, '#ffcc00', 2, 2);
                }
                throwBomb() {
                    this.bombs--;
                    playSound('bomb');
                    const bx = this.x + this.facing * 25;
                    const by = this.y - 15;
                    spawnExplosion(bx + 60, by, true);
                    enemies.forEach(e => {
                        if (Math.abs(e.x - bx) < 250 && Math.abs(e.y - by) < 200) {
                            e.takeDamage(5);
                        }
                    });
                    if (boss && Math.abs(boss.x - bx) < 300 && Math.abs(boss.y - by) < 250) {
                        boss.takeDamage(8);
                    }
                    for (let i = 0; i < 15; i++) {
                        spawnExplosion(bx + (Math.random() - 0.5) * 200, by + (Math.random() - 0.5) * 150, false);
                    }
                }
                takeDamage(dmg) {
                    if (this.invincible > 0 || this.rolling) return;
                    this.hp -= dmg;
                    this.invincible = HIT_INVINCIBILITY;
                    playSound('playerHit');
                    spawnParticles(this.x, this.y, 15, '#ff0000', 4, 3);
                    if (this.hp <= 0) {
                        this.hp = 0;
                        this.alive = false;
                        playSound('gameOver');
                    }
                }
                applyPowerUp(type) {
                    this.weaponType = type;
                    this.weaponTimer = WEAPON_DURATION;
                    this.spreadShot = false;
                    this.rapidFire = false;
                    this.fastBullets = false;
                    this.doubleShot = false;
                    switch (type) {
                        case 'SPREAD':
                            this.spreadShot = true;
                            this.bulletSpeed = BULLET_SPEED_SPREAD;
                            break;
                        case 'RAPID':
                            this.rapidFire = true;
                            this.bulletSpeed = BULLET_SPEED_NORMAL;
                            break;
                        case 'FAST':
                            this.fastBullets = true;
                            this.bulletSpeed = BULLET_SPEED_FAST;
                            break;
                        case 'DOUBLE':
                            this.doubleShot = true;
                            this.bulletSpeed = BULLET_SPEED_DOUBLE;
                            break;
                        case 'BOMB':
                            this.bombs = Math.min(MAX_BOMBS, this.bombs + 1);
                            this.weaponType = 'NORMAL';
                            this.weaponTimer = 0;
                            this.spreadShot = false;
                            this.rapidFire = false;
                            this.fastBullets = false;
                            this.doubleShot = false;
                            break;
                    }
                    playSound('powerup');
                }
                resetWeapon() {
                    this.weaponType = 'NORMAL';
                    this.spreadShot = false;
                    this.rapidFire = false;
                    this.fastBullets = false;
                    this.doubleShot = false;
                    this.bulletSpeed = BULLET_SPEED_NORMAL;
                }
                getHitbox() {
                    return { x: this.x - this.width / 2, y: this.y - this.height / 2, w: this.width, h: this.height };
                }
                draw(ctx) {
                    if (this.invincible > 0 && Math.floor(this.invincible / 3) % 2 === 0) {
                        ctx.globalAlpha = 0.5;
                    }
                    const cx = this.x;
                    const cy = this.y;
                    const f = this.facing;
                    if (this.rolling) {
                        this.drawRolling(ctx, cx, cy, f);
                    } else {
                        this.drawStanding(ctx, cx, cy, f);
                    }
                    ctx.globalAlpha = 1;
                }
                drawStanding(ctx, cx, cy, f) {
                    const legSwing = this.running ? Math.sin(this.animPhase * 2) * 7 : 0;
                    const bobY = this.running ? Math.abs(Math.sin(this.animPhase * 2)) * 2 : 0;
                    const dy = cy - bobY;
                    ctx.fillStyle = '#334422';
                    ctx.fillRect(cx - 8, dy + 20 + legSwing, 7, 18);
                    ctx.fillRect(cx + 1, dy + 20 - legSwing, 7, 18);
                    ctx.fillStyle = '#442211';
                    ctx.fillRect(cx - 9, dy + 35 + legSwing, 9, 5);
                    ctx.fillRect(cx, dy + 35 - legSwing, 9, 5);
                    ctx.fillStyle = '#445533';
                    ctx.beginPath();
                    ctx.roundRect(cx - 13, dy + 2, 26, 20, 4);
                    ctx.fill();
                    ctx.fillStyle = '#556644';
                    ctx.fillRect(cx - 11, dy + 4, 22, 6);
                    ctx.fillStyle = '#443322';
                    ctx.fillRect(cx - 8, dy + 8, 6, 8);
                    ctx.fillRect(cx + 2, dy + 8, 6, 8);
                    ctx.fillStyle = '#dda877';
                    ctx.beginPath();
                    ctx.arc(cx, dy - 5, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#334422';
                    ctx.beginPath();
                    ctx.arc(cx - 1, dy - 8, 10, Math.PI * 0.6, Math.PI * 1.6);
                    ctx.fill();
                    ctx.fillRect(cx - 11, dy - 14, 22, 7);
                    ctx.fillStyle = '#667788';
                    ctx.fillRect(cx - 6, dy - 10, 12, 4);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(cx - 3, dy - 9, 6, 2);
                    ctx.fillStyle = '#445533';
                    ctx.fillRect(cx + (f > 0 ? 5 : -16), dy + 5, 10, 10);
                    ctx.fillRect(cx + (f > 0 ? 13 : -22), dy + 8, 12, 7);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(cx + (f > 0 ? 18 : -28), dy + 6, 14, 5);
                    ctx.fillStyle = '#444';
                    ctx.fillRect(cx + (f > 0 ? 24 : -30), dy + 4, 4, 8);
                    ctx.fillRect(cx + (f > 0 ? 20 : -26), dy + 9, 6, 3);
                    if (this.weaponType !== 'NORMAL' && this.weaponTimer > 0) {
                        ctx.fillStyle = POWERUP_COLORS[this.weaponType] || '#ffcc00';
                        ctx.shadowColor = ctx.fillStyle;
                        ctx.shadowBlur = 8;
                        ctx.fillRect(cx - 6, dy - 20, 12, 3);
                        ctx.shadowBlur = 0;
                    }
                }
                drawRolling(ctx, cx, cy, f) {
                    ctx.fillStyle = '#445533';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + 8, 16, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#556644';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + 5, 12, 9, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#dda877';
                    ctx.beginPath();
                    ctx.arc(cx + f * 8, cy - 2, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#334422';
                    ctx.fillRect(cx + f * 2, cy - 8, 12, 7);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(cx + f * 4, cy - 6, 8, 3);
                }
            }

            // ============================================================
            // PLATFORM CLASS
            // ============================================================
            class Platform {
                constructor(x, y, w, h, type) {
                    this.x = x;
                    this.y = y;
                    this.w = w;
                    this.h = h;
                    this.type = type || 'normal';
                }
                draw(ctx) {
                    if (this.type === 'ground') {
                        ctx.fillStyle = '#554433';
                        ctx.fillRect(this.x, this.y, this.w, this.h);
                        ctx.fillStyle = '#665544';
                        ctx.fillRect(this.x, this.y, this.w, 5);
                        ctx.fillStyle = '#443322';
                        for (let i = 0; i < this.w; i += 20) {
                            ctx.fillRect(this.x + i + 5, this.y + this.h - 8, 8, 4);
                        }
                    } else if (this.type === 'metal') {
                        ctx.fillStyle = '#556677';
                        ctx.fillRect(this.x, this.y, this.w, this.h);
                        ctx.fillStyle = '#778899';
                        ctx.fillRect(this.x, this.y, this.w, 4);
                        ctx.fillStyle = '#445566';
                        ctx.fillRect(this.x, this.y + this.h - 4, this.w, 4);
                    } else {
                        ctx.fillStyle = '#5a4a3a';
                        ctx.fillRect(this.x, this.y, this.w, this.h);
                        ctx.fillStyle = '#6b5b4b';
                        ctx.fillRect(this.x, this.y, this.w, 4);
                        ctx.fillStyle = '#4a3a2a';
                        ctx.fillRect(this.x, this.y + this.h - 4, this.w, 4);
                    }
                }
            }

            // ============================================================
            // GAME STATE
            // ============================================================
            let gameState = 'title';
            let player = null;
            let enemies = [];
            let platforms = [];
            let powerups = [];
            let boss = null;
            let level = 1;
            let score = 0;
            let levelComplete = false;
            let levelCompleteTimer = 0;
            let gameOverTimer = 0;
            let cameraX = 0;
            let cameraY = 0;
            let shakeTimer = 0;
            let shakeIntensity = 0;
            let transitionTimer = 0;
            let nextLevelPending = false;
            let bgParallax = 0;
            let spawnTimer = 0;
            let levelStartTimer = 0;
            let bossSpawned = false;

            function resetLevel() {
                player = new Player(80, GROUND_Y - 40);
                enemies = [];
                platforms = [];
                powerups = [];
                projectiles = [];
                particles = [];
                boss = null;
                bossSpawned = false;
                levelComplete = false;
                levelCompleteTimer = 0;
                transitionTimer = 0;
                nextLevelPending = false;
                spawnTimer = 0;
                levelStartTimer = 60;
                generateLevel(level);
                if (BOSS_LEVELS.includes(level)) {
                    spawnBoss();
                }
            }

            function generateLevel(lvl) {
                platforms = [];
                platforms.push(new Platform(0, GROUND_Y, 4000, 100, 'ground'));
                const isBossLevel = BOSS_LEVELS.includes(lvl);
                const platformCount = Math.min(5 + lvl, 25);
                const gapStart = isBossLevel ? 3200 : 3800;
                for (let i = 0; i < platformCount; i++) {
                    const px = 200 + i * (3600 / platformCount) + (Math.random() - 0.5) * 80;
                    const py = GROUND_Y - 40 - Math.random() * 180;
                    const pw = 80 + Math.random() * 120;
                    const ph = 16;
                    if (px < gapStart || px > gapStart + 200) {
                        platforms.push(new Platform(px, py, pw, ph, 'normal'));
                    }
                }
                const numEnemies = Math.min(3 + lvl * 2, 30);
                for (let i = 0; i < numEnemies; i++) {
                    const ex = 150 + Math.random() * 3400;
                    const ey = GROUND_Y - 30;
                    let eType = 'grunt';
                    if (lvl >= 5 && Math.random() < 0.25) eType = 'elite';
                    if (lvl >= 8 && Math.random() < 0.15) eType = 'charger';
                    if (lvl >= 3 && Math.random() < 0.3) eType = 'drone';
                    if (lvl >= 4 && Math.random() < 0.2) eType = 'turret';
                    if (lvl >= 15 && Math.random() < 0.2) eType = 'alien';
                    if (lvl >= 25 && Math.random() < 0.15) eType = 'brute';
                    if (ex < gapStart || ex > gapStart + 300) {
                        const enemy = new Enemy(ex, ey, eType, lvl);
                        if (eType === 'drone') {
                            enemy.baseY = ey - 40 - Math.random() * 100;
                            enemy.y = enemy.baseY;
                        }
                        enemies.push(enemy);
                    }
                }
                const numPowerups = Math.min(2 + lvl * 0.3, 6);
                for (let i = 0; i < numPowerups; i++) {
                    const px = 250 + Math.random() * 3200;
                    const py = GROUND_Y - 30 - Math.random() * 100;
                    const pType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
                    if (px < gapStart || px > gapStart + 300) {
                        powerups.push(new PowerUp(px, py, pType));
                    }
                }
            }

            function spawnBoss() {
                const bossX = 3500;
                const bossY = 200;
                boss = new Boss(bossX, bossY, level);
                bossSpawned = true;
                playSound('bossRoar');
            }

            function checkCollisions() {
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    if (!p.alive) continue;
                    if (p.isPlayer) {
                        for (const e of enemies) {
                            if (e.alive && rectIntersect(p.getHitbox(), e.getHitbox())) {
                                if (e.takeDamage(p.damage)) {
                                    score += e.points;
                                    spawnExplosion(e.x, e.y, false);
                                }
                                p.alive = false;
                                spawnParticles(p.x, p.y, 5, '#ffcc00', 3, 2);
                                break;
                            }
                        }
                        if (boss && boss.alive && rectIntersect(p.getHitbox(), boss.getHitbox())) {
                            if (boss.takeDamage(p.damage)) {
                                score += level * 100;
                                bossDefeated();
                            }
                            p.alive = false;
                            spawnParticles(p.x, p.y, 5, '#ffcc00', 3, 2);
                        }
                    } else {
                        if (rectIntersect(p.getHitbox(), player.getHitbox())) {
                            player.takeDamage(p.damage);
                            p.alive = false;
                            spawnParticles(p.x, p.y, 8, '#ff4444', 3, 2);
                            shakeTimer = 8;
                            shakeIntensity = 5;
                        }
                    }
                }
                for (const e of enemies) {
                    if (e.alive && rectIntersect(player.getHitbox(), e.getHitbox())) {
                        player.takeDamage(e.damage);
                        e.takeDamage(2);
                        spawnParticles(player.x, player.y, 10, '#ff0000', 4, 3);
                        shakeTimer = 8;
                        shakeIntensity = 5;
                    }
                }
                if (boss && boss.alive && rectIntersect(player.getHitbox(), boss.getHitbox())) {
                    player.takeDamage(2);
                    shakeTimer = 10;
                    shakeIntensity = 8;
                }
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const pu = powerups[i];
                    if (pu.alive && rectIntersect(player.getHitbox(), pu.getHitbox())) {
                        player.applyPowerUp(pu.type);
                        score += 50;
                        spawnParticles(pu.x, pu.y, 15, POWERUP_COLORS[pu.type] || '#ffcc00', 4, 3);
                        pu.alive = false;
                    }
                }
            }

            function bossDefeated() {
                boss = null;
                score += level * 500;
                levelComplete = true;
                levelCompleteTimer = 120;
                playSound('levelClear');
                spawnExplosion(3500, 200, true);
            }

            function rectIntersect(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
            }

            function checkLevelComplete() {
                if (levelComplete) return;
                const isBossLevel = BOSS_LEVELS.includes(level);
                if (isBossLevel) {
                    if (!boss || !boss.alive) {
                        levelComplete = true;
                        levelCompleteTimer = 120;
                        playSound('levelClear');
                    }
                } else {
                    if (player.x > 3800) {
                        levelComplete = true;
                        levelCompleteTimer = 120;
                        playSound('levelClear');
                    }
                }
            }

            function advanceLevel() {
                if (level >= MAX_LEVELS) {
                    gameState = 'victory';
                    return;
                }
                level++;
                resetLevel();
                gameState = 'playing';
            }

            // ============================================================
            // CAMERA & BACKGROUND
            // ============================================================
            function updateCamera() {
                const targetX = player.x - CANVAS_WIDTH / 2;
                const targetY = player.y - CANVAS_HEIGHT / 2;
                cameraX += (targetX - cameraX) * 0.08;
                cameraY += (targetY - cameraY) * 0.06;
                cameraX = Math.max(0, Math.min(4000 - CANVAS_WIDTH, cameraX));
                cameraY = Math.max(-100, Math.min(150, cameraY));
            }

            function drawBackground(ctx) {
                const theme = Math.floor(level / 10);
                let skyTop, skyBottom, mountainColor, hillColor;
                if (theme === 0) {
                    skyTop = '#1a1a3a';
                    skyBottom = '#3a2a1a';
                    mountainColor = '#2a3a2a';
                    hillColor = '#3a4a3a';
                } else if (theme === 1) {
                    skyTop = '#1a1a2a';
                    skyBottom = '#2a3a4a';
                    mountainColor = '#2a2a3a';
                    hillColor = '#3a3a4a';
                } else if (theme === 2) {
                    skyTop = '#2a1a3a';
                    skyBottom = '#1a2a3a';
                    mountainColor = '#332244';
                    hillColor = '#443355';
                } else if (theme === 3) {
                    skyTop = '#1a0a2a';
                    skyBottom = '#2a0a1a';
                    mountainColor = '#221133';
                    hillColor = '#331122';
                } else {
                    skyTop = '#0a0a1a';
                    skyBottom = '#1a0a0a';
                    mountainColor = '#111122';
                    hillColor = '#221111';
                }
                const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
                grad.addColorStop(0, skyTop);
                grad.addColorStop(1, skyBottom);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                const par1 = cameraX * 0.2;
                ctx.fillStyle = mountainColor;
                for (let i = 0; i < 12; i++) {
                    const mx = (i * 200 - par1) % (CANVAS_WIDTH + 200) - 100;
                    const mh = 80 + Math.sin(i * 2.5) * 40;
                    ctx.beginPath();
                    ctx.moveTo(mx, GROUND_Y);
                    ctx.lineTo(mx + 100, GROUND_Y - mh);
                    ctx.lineTo(mx + 200, GROUND_Y);
                    ctx.fill();
                }
                const par2 = cameraX * 0.45;
                ctx.fillStyle = hillColor;
                for (let i = 0; i < 8; i++) {
                    const hx = (i * 150 - par2) % (CANVAS_WIDTH + 150) - 75;
                    const hh = 40 + Math.sin(i * 3.7) * 25;
                    ctx.beginPath();
                    ctx.moveTo(hx, GROUND_Y);
                    ctx.quadraticCurveTo(hx + 75, GROUND_Y - hh, hx + 150, GROUND_Y);
                    ctx.fill();
                }
                if (theme >= 3) {
                    const par3 = cameraX * 0.7;
                    ctx.fillStyle = 'rgba(255,0,100,0.15)';
                    for (let i = 0; i < 5; i++) {
                        const sx = (i * 300 - par3) % (CANVAS_WIDTH + 300) - 150;
                        const sy = 150 + Math.sin(i * 5 + Date.now() * 0.001) * 80;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 30, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                for (let i = 0; i < 20; i++) {
                    const stx = (i * 87 + Date.now() * 0.02) % CANVAS_WIDTH;
                    const sty = (i * 53) % 300;
                    ctx.fillRect(stx, sty, 2, 2);
                }
            }

            // ============================================================
            // HUD DRAWING
            // ============================================================
            function drawHUD(ctx) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(8, 8, 280, 52);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(8, 8, 280, 52);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText('SCORE: ' + score.toString().padStart(7, '0'), 16, 28);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('LEVEL ' + level + '/' + MAX_LEVELS, 16, 48);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 12px "Courier New", monospace';
                ctx.fillText('HP:', 16, 64);
                for (let i = 0; i < player.maxHp; i++) {
                    ctx.fillStyle = i < player.hp ? '#00ff44' : '#333';
                    ctx.fillRect(48 + i * 18, 52, 14, 14);
                    if (i < player.hp) {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(50 + i * 18, 54, 10, 10);
                        ctx.fillStyle = '#00ff44';
                        ctx.fillRect(51 + i * 18, 55, 8, 8);
                    }
                }
                ctx.fillStyle = '#ffaa00';
                ctx.font = 'bold 12px "Courier New", monospace';
                ctx.textAlign = 'left';
                const bombStr = '?? x' + player.bombs;
                ctx.fillText(bombStr, 16, 82);
                if (player.weaponType !== 'NORMAL' && player.weaponTimer > 0) {
                    const wpnColor = POWERUP_COLORS[player.weaponType] || '#ffcc00';
                    ctx.fillStyle = wpnColor;
                    ctx.fillText('WEAPON: ' + POWERUP_NAMES[player.weaponType], 16, 100);
                    const barW = 80;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(16, 104, barW, 6);
                    ctx.fillStyle = wpnColor;
                    ctx.fillRect(16, 104, barW * (player.weaponTimer / WEAPON_DURATION), 6);
                }
                if (boss && boss.alive) {
                    ctx.fillStyle = '#ff0044';
                    ctx.font = 'bold 16px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('? ' + boss.name + ' ?', CANVAS_WIDTH / 2, 30);
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(CANVAS_WIDTH / 2 - 100, 36, 200, 16);
                    ctx.fillStyle = boss.hp / boss.maxHp > 0.5 ? '#00ff44' :
                        boss.hp / boss.maxHp > 0.25 ? '#ffaa00' : '#ff3333';
                    ctx.fillRect(CANVAS_WIDTH / 2 - 98, 38, 196 * (boss.hp / boss.maxHp), 12);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px "Courier New", monospace';
                    ctx.fillText(boss.hp + '/' + boss.maxHp, CANVAS_WIDTH / 2, 48);
                }
                ctx.textAlign = 'left';
            }

            // TITLE SCREEN

                grad.addColorStop(0.5, '#0a0a1a');

                for (let i = 0; i < 30; i++) {
                    const sx = (i * 137 + Date.now() * 0.05) % CANVAS_WIDTH;
                    const sy = (i * 89 + Date.now() * 0.03) % CANVAS_HEIGHT;
                    ctx.fillRect(sx, sy, 3, 3);
                }
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 48px "Courier New", monospace';

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.fillText('50 LEVELS - 5 ALIEN BOSSES', CANVAS_WIDTH / 2, 280);

                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('Boss Levels: 10, 20, 30, 40, 50', CANVAS_WIDTH / 2, 310);
                ctx.fillStyle = '#ffcc00';

                if (blink) {
                    ctx.fillText('PRESS ENTER OR TAP TO START', CANVAS_WIDTH / 2, 380);
                }
                ctx.fillStyle = '#888';
                ctx.font = '12px "Courier New", monospace';
                ctx.fillText('Keyboard: Arrows/WASD Move | Space/Z Shoot | Shift/X Roll | B/C Bomb', CANVAS_WIDTH / 2, 430);
                ctx.fillText('Mobile: Use on-screen buttons', CANVAS_WIDTH / 2, 455);
                ctx.fillStyle = '#ff6600';
                ctx.font = 'bold 13px "Courier New", monospace';
                ctx.fillText('5 HITS TO DIE - COLLECT POWER-UPS!', CANVAS_WIDTH / 2, 490);
                ctx.textAlign = 'left';
            }

            // ============================================================
            // VICTORY SCREEN
            // ============================================================
            function drawVictoryScreen(ctx) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
                grad.addColorStop(0, '#1a0030');
                grad.addColorStop(0.5, '#0a001a');
                grad.addColorStop(1, '#000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 56px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 30;
                ctx.fillText('VICTORY!', CANVAS_WIDTH / 2, 200);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.fillText('ALL 50 LEVELS COMPLETE', CANVAS_WIDTH / 2, 260);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.fillText('FINAL SCORE: ' + score, CANVAS_WIDTH / 2, 320);
                ctx.fillStyle = '#aaa';
                ctx.font = '16px "Courier New", monospace';
                ctx.fillText('YOU DEFEATED THE ALIEN OVERLORD!', CANVAS_WIDTH / 2, 370);
                ctx.fillText('EARTH IS SAVED!', CANVAS_WIDTH / 2, 400);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 18px "Courier New", monospace';
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    ctx.fillText('PRESS ENTER TO PLAY AGAIN', CANVAS_WIDTH / 2, 460);
                }
                ctx.textAlign = 'left';
            }

            // ============================================================
            // GAME OVER SCREEN
            // ============================================================
            function drawGameOverScreen(ctx) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 220);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px "Courier New", monospace';
                ctx.fillText('YOU DIED ON LEVEL ' + level, CANVAS_WIDTH / 2, 270);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('SCORE: ' + score, CANVAS_WIDTH / 2, 310);
                ctx.fillStyle = '#aaa';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('PRESS ENTER TO RETRY LEVEL', CANVAS_WIDTH / 2, 370);
                ctx.textAlign = 'left';
            }

            // ============================================================
            // MAIN GAME LOOP
            // ============================================================
            function update() {
                if (gameState === 'title') {
                    if (isShoot() || keys['enter'] || touchState.shoot) {
                        gameState = 'playing';
                        level = 1;
                        score = 0;
                        resetLevel();
                        initAudio();
                    }
                    return;
                }
                if (gameState === 'victory') {
                    if (keys['enter'] || isShoot()) {
                        gameState = 'title';
                        level = 1;
                        score = 0;
                    }
                    return;
                }
                if (gameState === 'gameover') {
                    gameOverTimer--;
                    if (gameOverTimer <= 0 && (keys['enter'] || isShoot())) {
                        resetLevel();
                        gameState = 'playing';
                    }
                    return;
                }
                if (gameState === 'playing') {
                    if (levelStartTimer > 0) {
                        levelStartTimer--;
                        return;
                    }
                    if (levelComplete) {
                        levelCompleteTimer--;
                        updateCamera();
                        for (const p of particles) p.update();
                        particles = particles.filter(p => p.alive);
                        for (const p of projectiles) p.update();
                        projectiles = projectiles.filter(p => p.alive);
                        if (levelCompleteTimer <= 0) {
                            advanceLevel();
                        }
                        return;
                    }
                    player.update(platforms);
                    updateCamera();
                    for (const e of enemies) {
                        if (e.alive) e.update(player, platforms);
                    }
                    enemies = enemies.filter(e => e.alive);
                    if (boss && boss.alive) {
                        boss.update(player, platforms);
                    }
                    for (const p of projectiles) p.update();
                    projectiles = projectiles.filter(p => p.alive);
                    for (const pu of powerups) {
                        if (pu.alive) pu.update();
                    }
                    powerups = powerups.filter(pu => pu.alive);
                    for (const p of particles) p.update();
                    particles = particles.filter(p => p.alive);
                    if (shakeTimer > 0) shakeTimer--;
                    checkCollisions();
                    checkLevelComplete();
                    if (!player.alive && gameState === 'playing') {
                        gameState = 'gameover';
                        gameOverTimer = 120;
                    }
                    if (player.hp <= 0 && gameState === 'playing') {
                        gameState = 'gameover';
                        gameOverTimer = 120;
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                if (gameState === 'title') {
                    drawTitleScreen(ctx);
                    return;
                }
                if (gameState === 'victory') {
                    drawVictoryScreen(ctx);
                    return;
                }
                if (gameState === 'gameover') {
                    drawGameOverScreen(ctx);
                    return;
                }
                drawBackground(ctx);
                ctx.save();
                const shakeX = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;
                const shakeY = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;
                ctx.translate(-cameraX + shakeX, -cameraY + shakeY);
                for (const p of platforms) p.draw(ctx);
                for (const pu of powerups) {
                    if (pu.alive) pu.draw(ctx);
                }
                for (const e of enemies) {
                    if (e.alive) e.draw(ctx);
                }
                if (boss && boss.alive) {
                    boss.draw(ctx);
                }
                for (const p of projectiles) p.draw(ctx);
                if (player.alive) player.draw(ctx);
                for (const p of particles) {
                    if (p.alive) p.draw(ctx);
                }
                const exitX = 3850;
                const isBossLevel = BOSS_LEVELS.includes(level);
                if (!isBossLevel) {
                    ctx.fillStyle = 'rgba(0,255,0,0.3)';
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(exitX, GROUND_Y - 60, 40, 60);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#00ff00';
                    ctx.font = 'bold 12px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('EXIT', exitX + 20, GROUND_Y - 20);
                }
                ctx.restore();
                drawHUD(ctx);
                if (levelStartTimer > 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, CANVAS_HEIGHT / 2 - 40, CANVAS_WIDTH, 80);
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 32px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    const isBoss = BOSS_LEVELS.includes(level);
                    ctx.fillText(isBoss ? '? BOSS LEVEL ' + level + ' ?' : 'LEVEL ' + level, CANVAS_WIDTH / 2,
                        CANVAS_HEIGHT / 2 + 10);
                    if (isBoss && boss) {
                        ctx.fillStyle = '#ff0044';
                        ctx.font = 'bold 20px "Courier New", monospace';
                        ctx.fillText(boss.name + ' APPROACHING!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 40);
                    }
                    ctx.textAlign = 'left';
                }
                if (levelComplete) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, CANVAS_HEIGHT / 2 - 40, CANVAS_WIDTH, 80);
                    ctx.fillStyle = '#00ff44';
                    ctx.font = 'bold 30px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('LEVEL COMPLETE!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 10);
                    ctx.textAlign = 'left';
                }
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ============================================================
            // START THE GAME
            // ============================================================
            canvas.addEventListener('click', () => {
                if (gameState === 'title') {
                    gameState = 'playing';
                    level = 1;
                    score = 0;
                    resetLevel();
                    initAudio();
                } else if (gameState === 'gameover' && gameOverTimer <= 0) {
                    resetLevel();
                    gameState = 'playing';
                } else if (gameState === 'victory') {
                    gameState = 'title';
                    level = 1;
                    score = 0;
                }
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameState === 'title') {
                    gameState = 'playing';
                    level = 1;
                    score = 0;
                    resetLevel();
                    initAudio();
                } else if (gameState === 'gameover' && gameOverTimer <= 0) {
                    resetLevel();
                    gameState = 'playing';
                } else if (gameState === 'victory') {
                    gameState = 'title';
                    level = 1;
                    score = 0;
                }
            }, { passive: false });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (gameState === 'title') {
                        gameState = 'playing';
                        level = 1;
                        score = 0;
                        resetLevel();
                        initAudio();
                    } else if (gameState === 'gameover' && gameOverTimer <= 0) {
                        resetLevel();
                        gameState = 'playing';
                    } else if (gameState === 'victory') {
                        gameState = 'title';
                        level = 1;
                        score = 0;
                    }
                }
            });

            resetLevel();
            gameState = 'title';
            gameLoop();

            console.log('=== CONTRA: ALIEN WARS ===');
            console.log('50 Levels | 5 Alien Bosses | Power-ups | Mobile Controls');
            console.log('Boss Levels: 10, 20, 30, 40, 50');
            console.log('Controls: Arrows/WASD Move | Space/Z Shoot | Shift/X Roll | B/C Bomb');
            console.log('5 Hits to Die | Retro Chiptune Music | Procedural Sound Effects');
            console.log('All assets generated procedurally for authentic retro feel.');
        })();
    </script>
</body>
</html>
