<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CONTRA: ALIEN WARS - 50 Level Platform Shooter</title>
    <style>
        :root {
            --btn-size: 56px;
            --btn-gap: 8px;
            --btn-color: rgba(255, 255, 255, 0.25);
            --btn-border: rgba(255, 255, 255, 0.5);
            --btn-active: rgba(255, 200, 0, 0.6);
            --hud-bg: rgba(0, 0, 0, 0.7);
            --accent: #ffcc00;
            --danger: #ff3333;
            --health: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', 'Courier', monospace;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 540px;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #111;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 200, 0, 0.15), 0 0 80px rgba(255, 0, 0, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Mobile controls always visible */
        #mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 20;
            padding: 10px;
        }

        .ctrl-group {
            pointer-events: auto;
            display: flex;
            gap: var(--btn-gap);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            background: var(--btn-color);
            border: 2px solid var(--btn-border);
            border-radius: 50%;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            touch-action: manipulation;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .ctrl-btn:active,
        .ctrl-btn.pressed {
            background: var(--btn-active);
            border-color: #ffcc00;
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
        }

        .ctrl-btn-wide {
            width: calc(var(--btn-size) * 1.2);
            border-radius: 28px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, var(--btn-size));
            grid-template-rows: repeat(3, var(--btn-size));
            gap: 2px;
            pointer-events: auto;
        }
        .dpad .ctrl-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            font-size: 18px;
        }
        .dpad-empty {
            pointer-events: none;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        #ctrl-left {
            grid-column: 1;
            grid-row: 2;
        }
        #ctrl-right {
            grid-column: 3;
            grid-row: 2;
        }
        #ctrl-up {
            grid-column: 2;
            grid-row: 1;
        }
        #ctrl-down {
            grid-column: 2;
            grid-row: 3;
        }
        .dpad .dpad-empty {
            grid-column: 2;
            grid-row: 2;
        }

        #controls-left {
            position: relative;
            left: 12px;
            bottom: 14px;
        }
        #controls-right {
            position: relative;
            right: 12px;
            bottom: 14px;
            gap: 6px;
        }

        .btn-shoot {
            background: rgba(255, 50, 50, 0.35) !important;
            border-color: rgba(255, 100, 100, 0.6) !important;
            font-size: 12px !important;
        }
        .btn-shoot:active,
        .btn-shoot.pressed {
            background: rgba(255, 0, 0, 0.7) !important;
            border-color: #ff3333 !important;
        }

        .btn-roll {
            background: rgba(50, 150, 255, 0.35) !important;
            border-color: rgba(100, 180, 255, 0.6) !important;
            font-size: 12px !important;
        }
        .btn-roll:active,
        .btn-roll.pressed {
            background: rgba(0, 100, 255, 0.7) !important;
            border-color: #3399ff !important;
        }

        .btn-bomb {
            background: rgba(255, 180, 0, 0.35) !important;
            border-color: rgba(255, 200, 80, 0.6) !important;
            font-size: 12px !important;
        }
        .btn-bomb:active,
        .btn-bomb.pressed {
            background: rgba(255, 150, 0, 0.7) !important;
            border-color: #ffaa00 !important;
        }

        @media (max-width: 600px) {
            :root {
                --btn-size: 42px;
                --btn-gap: 4px;
            }
            .ctrl-btn {
                font-size: 10px;
                border-width: 1.5px;
            }
            .dpad {
                gap: 1px;
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div id="controls-left" class="ctrl-group">
                <div class="dpad">
                    <button class="ctrl-btn" id="ctrl-up" aria-label="Up">?</button>
                    <button class="ctrl-btn dpad-empty" disabled></button>
                    <button class="ctrl-btn" id="ctrl-left" aria-label="Left">?</button>
                    <button class="ctrl-btn" id="ctrl-right" aria-label="Right">?</button>
                    <button class="ctrl-btn" id="ctrl-down" aria-label="Down">?</button>
                </div>
            </div>
            <div id="controls-right" class="ctrl-group">
                <button class="ctrl-btn btn-roll ctrl-btn-wide" id="ctrl-roll">ROLL</button>
                <button class="ctrl-btn btn-shoot ctrl-btn-wide" id="ctrl-shoot">SHOOT</button>
                <button class="ctrl-btn btn-bomb ctrl-btn-wide" id="ctrl-bomb">BOMB</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // CONSTANTS & CONFIGURATION
            // ============================================================
            const CANVAS_WIDTH = 960;
            const CANVAS_HEIGHT = 540;
            const GROUND_Y = 460;
            const GRAVITY = 0.65;
            const PLAYER_SPEED = 4.2;
            const PLAYER_JUMP = -11.5;
            const PLAYER_MAX_HP = 5;
            const MAX_LEVELS = 50;
            const BOSS_LEVELS = [10, 20, 30, 40, 50];
            const POWERUP_TYPES = ['SPREAD', 'RAPID', 'FAST', 'DOUBLE', 'BOMB'];
            const POWERUP_COLORS = {
                SPREAD: '#ff6600',
                RAPID: '#00ccff',
                FAST: '#ffff00',
                DOUBLE: '#ff00ff',
                BOMB: '#ffaa00'
            };
            const POWERUP_LABELS = {
                SPREAD: 'S',
                RAPID: 'R',
                FAST: 'F',
                DOUBLE: 'D',
                BOMB: 'B'
            };
            const POWERUP_NAMES = {
                SPREAD: 'SPREAD SHOT',
                RAPID: 'RAPID FIRE',
                FAST: 'FAST BULLETS',
                DOUBLE: 'DOUBLE SHOT',
                BOMB: 'BOMB +1'
            };
            const WEAPON_DURATION = 10000;
            const ROLL_COOLDOWN = 800;
            const ROLL_DURATION = 350;
            const ROLL_SPEED = 8;
            const ROLL_INVINCIBILITY = 350;
            const HIT_INVINCIBILITY = 1000;
            const MAX_BOMBS = 9;
            const BULLET_SPEED_NORMAL = 9;
            const BULLET_SPEED_FAST = 14;
            const BULLET_SPEED_SPREAD = 8;
            const BULLET_SPEED_DOUBLE = 10;
            const ENEMY_BULLET_SPEED = 4.5;

            // ============================================================
            // CANVAS SETUP
            // ============================================================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;

            // ============================================================
            // AUDIO SYSTEM
            // ============================================================
            let audioCtx = null;
            let musicGainNode = null;
            let sfxGainNode = null;
            let musicInterval = null;
            let musicStep = 0;
            let musicTempo = 140;
            let isAudioInitialized = false;

            function initAudio() {
                if (isAudioInitialized) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    musicGainNode = audioCtx.createGain();
                    musicGainNode.gain.value = 0.12;
                    musicGainNode.connect(audioCtx.destination);
                    sfxGainNode = audioCtx.createGain();
                    sfxGainNode.gain.value = 0.25;
                    sfxGainNode.connect(audioCtx.destination);
                    isAudioInitialized = true;
                    startMusic();
                } catch (e) {
                    console.log('Audio not available');
                }
            }

            function playSound(type) {
                if (!isAudioInitialized || !audioCtx) return;
                try {
                    const now = audioCtx.currentTime;
                    switch (type) {
                        case 'shoot':
                            playShootSound(now);
                            break;
                        case 'enemyShoot':
                            playEnemyShootSound(now);
                            break;
                        case 'hit':
                            playHitSound(now);
                            break;
                        case 'playerHit':
                            playPlayerHitSound(now);
                            break;
                        case 'powerup':
                            playPowerupSound(now);
                            break;
                        case 'explosion':
                            playExplosionSound(now);
                            break;
                        case 'bomb':
                            playBombSound(now);
                            break;
                        case 'jump':
                            playJumpSound(now);
                            break;
                        case 'roll':
                            playRollSound(now);
                            break;
                        case 'bossRoar':
                            playBossRoarSound(now);
                            break;
                        case 'levelClear':
                            playLevelClearSound(now);
                            break;
                        case 'gameOver':
                            playGameOverSound(now);
                            break;
                        case 'bossHit':
                            playBossHitSound(now);
                            break;
                    }
                } catch (e) {}
            }

            function playShootSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, t);
                osc.frequency.exponentialRampToValueAtTime(300, t + 0.08);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.1);
            }

            function playEnemyShootSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.exponentialRampToValueAtTime(150, t + 0.12);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.15);
            }

            function playHitSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(200, t + 0.06);
                gain.gain.setValueAtTime(0.35, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.08);
            }

            function playPlayerHitSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(60, t + 0.25);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.3);
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(200, t + 0.05);
                osc2.frequency.exponentialRampToValueAtTime(40, t + 0.3);
                gain2.gain.setValueAtTime(0.4, t + 0.05);
                gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                osc2.connect(gain2);
                gain2.connect(sfxGainNode);
                osc2.start(t + 0.05);
                osc2.stop(t + 0.35);
            }

            function playPowerupSound(t) {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, t + i * 0.07);
                    gain.gain.setValueAtTime(0.3, t + i * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.15);
                    osc.connect(gain);
                    gain.connect(sfxGainNode);
                    osc.start(t + i * 0.07);
                    osc.stop(t + i * 0.07 + 0.15);
                });
            }

            function playExplosionSound(t) {
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 3);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2000, t);
                filter.frequency.exponentialRampToValueAtTime(100, t + 0.3);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(sfxGainNode);
                noise.start(t);
                noise.stop(t + 0.3);
            }

            function playBombSound(t) {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 2);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.7, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(500, t);
                filter.frequency.exponentialRampToValueAtTime(50, t + 0.5);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(sfxGainNode);
                noise.start(t);
                noise.stop(t + 0.5);
                const osc = audioCtx.createOscillator();
                const og = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 0.4);
                og.gain.setValueAtTime(0.5, t);
                og.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
                osc.connect(og);
                og.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.45);
            }

            function playJumpSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(700, t + 0.1);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.12);
            }

            function playRollSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, t);
                osc.frequency.exponentialRampToValueAtTime(150, t + 0.2);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.22);
            }

            function playBossRoarSound(t) {
                const bufferSize = audioCtx.sampleRate * 0.8;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 2);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.6, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(300, t);
                filter.frequency.linearRampToValueAtTime(100, t + 0.7);
                filter.Q.setValueAtTime(1, t);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(sfxGainNode);
                noise.start(t);
                noise.stop(t + 0.7);
                const osc = audioCtx.createOscillator();
                const og = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, t);
                osc.frequency.linearRampToValueAtTime(30, t + 0.6);
                og.gain.setValueAtTime(0.4, t);
                og.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
                osc.connect(og);
                og.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.65);
            }

            function playLevelClearSound(t) {
                [392, 523, 659, 784, 1047].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, t + i * 0.1);
                    gain.gain.setValueAtTime(0.25, t + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(sfxGainNode);
                    osc.start(t + i * 0.1);
                    osc.stop(t + i * 0.1 + 0.2);
                });
            }

            function playGameOverSound(t) {
                [440, 415, 392, 370, 349, 330, 311, 294].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, t + i * 0.15);
                    gain.gain.setValueAtTime(0.3, t + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.2);
                    osc.connect(gain);
                    gain.connect(sfxGainNode);
                    osc.start(t + i * 0.15);
                    osc.stop(t + i * 0.15 + 0.2);
                });
            }

            function playBossHitSound(t) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(900, t);
                osc.frequency.exponentialRampToValueAtTime(400, t + 0.06);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                osc.connect(gain);
                gain.connect(sfxGainNode);
                osc.start(t);
                osc.stop(t + 0.08);
            }

            // ============================================================
            // CHIPTUNE MUSIC SYSTEM
            // ============================================================
            const MELODY_PATTERN = [
                261, 311, 392, 311, 349, 311, 261, 311,
                261, 311, 392, 311, 466, 392, 311, 261,
                293, 349, 440, 349, 392, 349, 293, 349,
                293, 349, 440, 349, 466, 440, 349, 293,
                261, 311, 392, 311, 349, 311, 261, 311,
                261, 311, 392, 466, 523, 466, 392, 311,
                293, 349, 440, 349, 392, 440, 466, 440,
                392, 349, 293, 311, 349, 392, 440, 466
            ];
            const BASS_PATTERN = [
                130, 130, 130, 130, 155, 155, 155, 155,
                130, 130, 130, 130, 155, 155, 155, 155,
                146, 146, 146, 146, 174, 174, 174, 174,
                146, 146, 146, 146, 174, 174, 155, 155,
                130, 130, 130, 130, 155, 155, 155, 155,
                130, 130, 130, 130, 196, 196, 174, 174,
                146, 146, 146, 146, 174, 174, 174, 174,
                196, 196, 174, 174, 155, 155, 130, 130
            ];

            function startMusic() {
                if (!isAudioInitialized || musicInterval) return;
                const stepDuration = 60 / musicTempo / 2;
                musicInterval = setInterval(() => {
                    if (!audioCtx || audioCtx.state === 'closed') {
                        stopMusic();
                        return;
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    playMusicStep();
                    musicStep = (musicStep + 1) % MELODY_PATTERN.length;
                }, stepDuration * 1000);
            }

            function stopMusic() {
                if (musicInterval) {
                    clearInterval(musicInterval);
                    musicInterval = null;
                }
            }

            function playMusicStep() {
                const t = audioCtx.currentTime;
                const melodyFreq = MELODY_PATTERN[musicStep];
                const bassFreq = BASS_PATTERN[musicStep];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(melodyFreq, t);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                osc.connect(gain);
                gain.connect(musicGainNode);
                osc.start(t);
                osc.stop(t + 0.18);
                if (musicStep % 4 === 0) {
                    const bOsc = audioCtx.createOscillator();
                    const bGain = audioCtx.createGain();
                    bOsc.type = 'triangle';
                    bOsc.frequency.setValueAtTime(bassFreq, t);
                    bGain.gain.setValueAtTime(0.3, t);
                    bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                    bOsc.connect(bGain);
                    bGain.connect(musicGainNode);
                    bOsc.start(t);
                    bOsc.stop(t + 0.25);
                }
                if (musicStep % 8 === 4) {
                    const nOsc = audioCtx.createOscillator();
                    const nGain = audioCtx.createGain();
                    nOsc.type = 'square';
                    nOsc.frequency.setValueAtTime(2000, t);
                    nGain.gain.setValueAtTime(0.04, t);
                    nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                    nOsc.connect(nGain);
                    nGain.connect(musicGainNode);
                    nOsc.start(t);
                    nOsc.stop(t + 0.04);
                }
            }

            // ============================================================
            // INPUT SYSTEM
            // ============================================================
            const keys = {};
            const touchState = {
                left: false,
                right: false,
                up: false,
                down: false,
                shoot: false,
                roll: false,
                bomb: false
            };
            let lastShootTime = 0;
            let lastRollTime = 0;
            let lastBombTime = 0;
            const SHOOT_COOLDOWN = 180;
            const BOMB_COOLDOWN = 500;

            document.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                keys[e.code] = true;
                if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                }
            });
            document.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
                keys[e.code] = false;
            });

            function setupMobileButton(id, stateKey) {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    touchState[stateKey] = true;
                    btn.classList.add('pressed');
                }, { passive: false });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    touchState[stateKey] = false;
                    btn.classList.remove('pressed');
                }, { passive: false });
                btn.addEventListener('touchcancel', (e) => {
                    touchState[stateKey] = false;
                    btn.classList.remove('pressed');
                });
                btn.addEventListener('mousedown', (e) => {
                    touchState[stateKey] = true;
                    btn.classList.add('pressed');
                });
                btn.addEventListener('mouseup', () => {
                    touchState[stateKey] = false;
                    btn.classList.remove('pressed');
                });
                btn.addEventListener('mouseleave', () => {
                    touchState[stateKey] = false;
                    btn.classList.remove('pressed');
                });
            }

            setupMobileButton('ctrl-left', 'left');
            setupMobileButton('ctrl-right', 'right');
            setupMobileButton('ctrl-up', 'up');
            setupMobileButton('ctrl-down', 'down');
            setupMobileButton('ctrl-shoot', 'shoot');
            setupMobileButton('ctrl-roll', 'roll');
            setupMobileButton('ctrl-bomb', 'bomb');

            function isLeft() {
                return keys['arrowleft'] || keys['a'] || touchState.left;
            }

            function isRight() {
                return keys['arrowright'] || keys['d'] || touchState.right;
            }

            function isUp() {
                return keys['arrowup'] || keys['w'] || touchState.up;
            }

            function isDown() {
                return keys['arrowdown'] || keys['s'] || touchState.down;
            }

            function isShoot() {
                return keys[' '] || keys['z'] || keys['j'] || keys['space'] || touchState.shoot;
            }

            function isRoll() {

            // ============================================================
            // PARTICLES
            // ============================================================
            class Particle {
                constructor(x, y, vx, vy, life, color, size) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.life = life;
                    this.maxLife = life;
                    this.color = color;
                    this.size = size || 3;
                    this.alive = true;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.1;
                    this.life--;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = this.life / this.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    const s = this.size * alpha;
                    ctx.fillRect(this.x - s / 2, this.y - s / 2, s, s);
                    ctx.globalAlpha = 1;
                }
            }

            let particles = [];

            function spawnParticles(x, y, count, color, speed, size, spread) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = speed * (0.3 + Math.random() * 0.7);
                    const vx = Math.cos(angle) * spd;
                    const vy = Math.sin(angle) * spd - 1;
                    const life = 20 + Math.random() * 30;
                    const sz = size * (0.5 + Math.random() * 0.8);
                    particles.push(new Particle(x, y, vx, vy, life, color, sz));
                }
            }

            function spawnExplosion(x, y, big) {
                const count = big ? 40 : 20;
                spawnParticles(x, y, count, '#ffaa00', big ? 6 : 4, big ? 5 : 3);
                spawnParticles(x, y, count, '#ff4400', big ? 5 : 3, big ? 4 : 2);
                spawnParticles(x, y, count / 2, '#ffff00', big ? 4 : 2, big ? 3 : 2);
                if (big) {
                    spawnParticles(x, y, 15, '#ffffff', 3, 2);
                }
            }

            // ============================================================
            // POWERUP CLASS
            // ============================================================
            class PowerUp {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.vy = -6;
                    this.landed = false;
                    this.grounded = false;
                    this.width = 22;
                    this.height = 22;
                    this.bobPhase = Math.random() * Math.PI * 2;
                    this.alive = true;
                    this.life = 600;
                }
                update() {
                    this.bobPhase += 0.06;
                    if (!this.grounded) {
                        this.vy += GRAVITY * 0.6;
                        this.y += this.vy;
                        if (this.y >= GROUND_Y - this.height / 2) {
                            this.y = GROUND_Y - this.height / 2;
                            this.vy = 0;
                            this.grounded = true;
                        }
                    }
                    this.life--;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const bobY = this.grounded ? Math.sin(this.bobPhase) * 3 : 0;
                    const cx = this.x;
                    const cy = this.y + bobY;
                    const color = POWERUP_COLORS[this.type] || '#ffcc00';
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(cx - 10, cy + 4, 20, 14);
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 3, cy - 4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 11px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(POWERUP_LABELS[this.type] || '?', cx, cy + 1);
                    ctx.restore();
                }
                getHitbox() {
                    return { x: this.x - 11, y: this.y - 11, w: 22, h: 22 };
                }
            }

            // ============================================================
            // PROJECTILE CLASS
            // ============================================================
            class Projectile {
                constructor(x, y, vx, vy, isPlayer, damage, color, size) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.isPlayer = isPlayer;
                    this.damage = damage || 1;
                    this.color = color || (isPlayer ? '#ffdd00' : '#ff4444');
                    this.size = size || (isPlayer ? 3 : 4);
                    this.alive = true;
                    this.life = 300;
                    this.trail = [];
                    this.splitChance = 0;
                }
                update() {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 6) this.trail.shift();
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life--;
                    if (this.life <= 0 || this.x < -50 || this.x > 4000 || this.y < -100 || this.y > 700) {
                        this.alive = false;
                    }
                    if (this.isPlayer && this.splitChance > 0 && Math.random() < this.splitChance) {
                        this.alive = false;
                        for (let i = -1; i <= 1; i++) {
                            const angle = i * 0.5;
                            const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy) * 0.9;
                            const nvx = Math.cos(angle) * spd;
                            const nvy = Math.sin(angle) * spd;
                            projectiles.push(new Projectile(this.x, this.y, nvx, nvy, true, this.damage,
                                '#ffaa00', 2.5));
                        }
                    }
                }
                draw(ctx) {
                    for (let i = 0; i < this.trail.length; i++) {
                        const alpha = (i + 1) / this.trail.length * 0.5;
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = this.color;
                        const s = this.size * (0.5 + (i / this.trail.length) * 0.5);
                        ctx.fillRect(this.trail[i].x - s / 2, this.trail[i].y - s / 2, s, s);
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x - this.vx * 0.3, this.y - this.vy * 0.3, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                getHitbox() {
                    return { x: this.x - this.size, y: this.y - this.size, w: this.size * 2, h: this.size * 2 };
                }
            }

            let projectiles = [];

            // ============================================================
            // ENEMY CLASSES
            // ============================================================
            class Enemy {
                constructor(x, y, type, level) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.level = level;
                    this.alive = true;
                    this.vx = 0;
                    this.vy = 0;
                    this.dir = -1;
                    this.shootTimer = 60 + Math.random() * 120;
                    this.animPhase = Math.random() * Math.PI * 2;
                    this.flashTimer = 0;
                    this.grounded = false;
                    this.setupStats();
                    this.setupVisuals();
                }
                setupStats() {
                    const lvl = this.level;
                    switch (this.type) {
                        case 'grunt':
                            this.hp = 2;
                            this.width = 28;
                            this.height = 42;
                            this.speed = 1.2 + lvl * 0.03;
                            this.damage = 1;
                            this.points = 100;
                            this.shootRange = 400;
                            this.shootChance = 0.4;
                            break;
                        case 'elite':
                            this.hp = 4;
                            this.width = 30;
                            this.height = 46;
                            this.speed = 1.5 + lvl * 0.04;
                            this.damage = 1;
                            this.points = 250;
                            this.shootRange = 450;
                            this.shootChance = 0.6;
                            break;
                        case 'drone':
                            this.hp = 3;
                            this.width = 26;
                            this.height = 26;
                            this.speed = 2 + lvl * 0.05;
                            this.damage = 1;
                            this.points = 180;
                            this.shootRange = 350;
                            this.shootChance = 0.5;
                            this.baseY = y;
                            this.phase = Math.random() * Math.PI * 2;
                            break;
                        case 'turret':
                            this.hp = 5;
                            this.width = 32;
                            this.height = 28;
                            this.speed = 0;
                            this.damage = 1;
                            this.points = 200;
                            this.shootRange = 500;
                            this.shootChance = 0.7;
                            break;
                        case 'charger':
                            this.hp = 3;
                            this.width = 28;
                            this.height = 36;
                            this.speed = 3 + lvl * 0.06;
                            this.damage = 1;
                            this.points = 220;
                            this.shootRange = 100;
                            this.shootChance = 0;
                            break;
                        case 'alien':
                            this.hp = 5;
                            this.width = 28;
                            this.height = 40;
                            this.speed = 2 + lvl * 0.05;
                            this.damage = 1;
                            this.points = 300;
                            this.shootRange = 400;
                            this.shootChance = 0.55;
                            this.alienColor = this.getAlienColor(lvl);
                            break;
                        case 'brute':
                            this.hp = 10;
                            this.width = 40;
                            this.height = 52;
                            this.speed = 0.8 + lvl * 0.02;
                            this.damage = 2;
                            this.points = 500;
                            this.shootRange = 350;
                            this.shootChance = 0.4;
                            break;
                        default:
                            this.hp = 2;
                            this.width = 28;
                            this.height = 40;
                            this.speed = 1;
                            this.damage = 1;
                            this.points = 100;
                            this.shootRange = 350;
                            this.shootChance = 0.4;
                    }
                    this.maxHp = this.hp;
                }
                getAlienColor(lvl) {
                    const colors = ['#aa44cc', '#44ccaa', '#ccaa44', '#cc4477', '#44aacc', '#77cc44'];
                    return colors[(lvl - 1) % colors.length];
                }
                setupVisuals() {
                    this.bodyColor = '#556655';
                    this.headColor = '#445544';
                    this.armColor = '#556644';
                    this.legColor = '#334433';
                    if (this.type === 'elite') {
                        this.bodyColor = '#667788';
                        this.headColor = '#556677';
                    } else if (this.type === 'drone') {
                        this.bodyColor = '#884455';
                        this.headColor = '#663344';
                    } else if (this.type === 'turret') {
                        this.bodyColor = '#666666';
                        this.headColor = '#555555';
                    } else if (this.type === 'charger') {
                        this.bodyColor = '#884422';
                        this.headColor = '#663311';
                    } else if (this.type === 'alien') {
                        this.bodyColor = this.alienColor;
                        this.headColor = this.alienColor;
                    } else if (this.type === 'brute') {
                        this.bodyColor = '#445566';
                        this.headColor = '#334455';
                    }
                }
                update(player, platforms) {
                    this.animPhase += 0.08;
                    if (this.flashTimer > 0) this.flashTimer--;
                    if (this.type === 'drone') {
                        this.phase += 0.04;
                        this.x -= this.speed * 0.7;
                        this.y = this.baseY + Math.sin(this.phase) * 40;
                        if (this.x < -50) this.x = 4000;
                    } else if (this.type === 'turret') {
                        this.vx = 0;
                        this.vy += GRAVITY;
                        this.y += this.vy;
                        for (const p of platforms) {
                            if (this.collidesWith(p)) {
                                this.y = p.y - this.height / 2;
                                this.vy = 0;
                                this.grounded = true;
                            }
                        }
                        if (this.y > GROUND_Y) { this.y = GROUND_Y;
                            this.vy = 0;
                            this.grounded = true; }
                    } else if (this.type === 'charger') {
                        const dist = Math.abs(this.x - player.x);
                        if (dist < 300 && dist > 30) {
                            this.dir = this.x > player.x ? -1 : 1;
                            this.vx = this.dir * this.speed;
                        } else if (dist < 30) {
                            this.vx = this.dir * this.speed * 0.3;
                        } else {
                            this.vx = 0;
                        }
                        this.vy += GRAVITY;
                        this.y += this.vy;
                        this.grounded = false;
                        for (const p of platforms) {
                            if (this.vx > 0 && this.collidesWith(p)) {
                                this.x = p.x - this.width / 2;
                                this.vx = 0;
                            } else if (this.vx < 0 && this.collidesWith(p)) {
                                this.x = p.x + p.w + this.width / 2;
                                this.vx = 0;
                            }
                        }
                        if (this.y >= GROUND_Y - this.height / 2) {
                            this.y = GROUND_Y - this.height / 2;
                            this.vy = 0;
                            this.grounded = true;
                        }
                        this.x += this.vx;
                    } else {
                        this.vx = this.dir * this.speed;
                        this.vy += GRAVITY;
                        this.y += this.vy;
                        this.grounded = false;
                        for (const p of platforms) {
                            if (this.vy > 0 && this.y + this.height / 2 > p.y && this.y + this.height / 2 < p.y + p.h +
                                10 &&
                                this.x > p.x - this.width / 2 && this.x < p.x + p.w + this.width / 2) {
                                this.y = p.y - this.height / 2;
                                this.vy = 0;
                                this.grounded = true;
                            }
                            if (this.collidesWith(p)) {
                                if (this.vx > 0) { this.x = p.x - this.width / 2;
                                    this.dir = -1; } else if (this.vx < 0) { this.x = p.x + p.w + this.width / 2;
                                    this.dir = 1; }
                            }
                        }
                        if (this.y >= GROUND_Y - this.height / 2) {
                            this.y = GROUND_Y - this.height / 2;
                            this.vy = 0;
                            this.grounded = true;
                        }
                        this.x += this.vx;
                        if (this.x < 30) this.dir = 1;
                        if (this.x > 3900) this.dir = -1;
                    }
                    this.shootTimer--;
                    if (this.shootTimer <= 0 && this.shootChance > 0) {
                        const dist = Math.abs(this.x - player.x);
                        if (dist < this.shootRange && Math.random() < this.shootChance) {
                            this.shoot(player);
                        }
                        this.shootTimer = 60 + Math.random() * 100;
                    }
                }
                shoot(player) {
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist === 0) return;
                    const spd = ENEMY_BULLET_SPEED + this.level * 0.04;
                    const vx = dx / dist * spd;
                    const vy = dy / dist * spd;
                    projectiles.push(new Projectile(this.x + this.dir * 10, this.y - 5, vx, vy, false, this.damage,
                        '#ff4444', 3.5));
                    playSound('enemyShoot');
                }
                takeDamage(dmg) {
                    this.hp -= dmg;
                    this.flashTimer = 8;
                    if (this.hp <= 0) {
                        this.alive = false;
                        spawnExplosion(this.x, this.y, false);
                        playSound('hit');
                        return true;
                    }
                    playSound('bossHit');
                    return false;
                }
                collidesWith(rect) {
                    const hb = this.getHitbox();
                    return hb.x < rect.x + rect.w && hb.x + hb.w > rect.x &&
                        hb.y < rect.y + rect.h && hb.y + hb.h > rect.y;
                }
                getHitbox() {
                    return { x: this.x - this.width / 2, y: this.y - this.height / 2, w: this.width, h: this.height };
                }
                draw(ctx) {
                    const cx = this.x;
                    const cy = this.y;
                    const flash = this.flashTimer > 0;
                    ctx.save();
                    if (flash) {
                        ctx.fillStyle = '#fff';
                        ctx.globalAlpha = 0.8;
                    } else {
                        ctx.globalAlpha = 1;
                    }
                    const bC = flash ? '#fff' : this.bodyColor;
                    const hC = flash ? '#fff' : this.headColor;
                    switch (this.type) {
                        case 'grunt':
                        case 'elite':
                        case 'charger':
                        case 'brute':
                            this.drawHumanoid(ctx, cx, cy, bC, hC);
                            break;
                        case 'drone':
                            this.drawDrone(ctx, cx, cy, bC, hC);
                            break;
                        case 'turret':
                            this.drawTurret(ctx, cx, cy, bC, hC);
                            break;
                        case 'alien':
                            this.drawAlien(ctx, cx, cy, bC, hC);
                            break;
                        default:
                            this.drawHumanoid(ctx, cx, cy, bC, hC);
                    }
                    ctx.globalAlpha = 1;
                    ctx.restore();
                    if (this.maxHp > 3 && this.hp > 0) {
                        const hbW = this.width + 8;
                        ctx.fillStyle = '#333';
                        ctx.fillRect(this.x - hbW / 2, this.y - this.height / 2 - 12, hbW, 4);
                        ctx.fillStyle = this.hp / this.maxHp > 0.5 ? '#00ff44' :
                            this.hp / this.maxHp > 0.25 ? '#ffaa00' : '#ff3333';
                        ctx.fillRect(this.x - hbW / 2, this.y - this.height / 2 - 12, hbW * (this.hp / this.maxHp),
                            4);
                    }
                }
                drawHumanoid(ctx, cx, cy, bC, hC) {
                    const legSwing = Math.sin(this.animPhase) * 6;
                    ctx.fillStyle = this.legColor;
                    ctx.fillRect(cx - 6, cy + this.height / 4 + legSwing, 5, this.height * 0.4);
                    ctx.fillRect(cx + 1, cy + this.height / 4 - legSwing, 5, this.height * 0.4);
                    ctx.fillStyle = bC;
                    ctx.fillRect(cx - this.width / 3, cy - 4, this.width * 0.66, this.height * 0.4);
                    ctx.fillStyle = hC;
                    ctx.beginPath();
                    ctx.arc(cx, cy - this.height / 2 + 8, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(cx - 2, cy - this.height / 2 + 5, 4, 3);
                    ctx.fillStyle = this.armColor;
                    const armY = cy - 2;
                    ctx.fillRect(cx - 12, armY, 6, 12);
                    ctx.fillRect(cx + 6, armY, 6, 12);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(cx + (this.dir > 0 ? 10 : -16), armY + 4, 8, 5);
                }
                drawDrone(ctx, cx, cy, bC, hC) {
                    ctx.fillStyle = bC;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 14, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = hC;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 8, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 8, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#333';
                    ctx.fillRect(cx - 16, cy - 2, 8, 3);
                    ctx.fillRect(cx + 8, cy - 2, 8, 3);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(cx - 2, cy + 8, 4, 4);
                }
                drawTurret(ctx, cx, cy, bC, hC) {
                    ctx.fillStyle = bC;
                    ctx.fillRect(cx - 14, cy - 8, 28, 16);
                    ctx.fillStyle = hC;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 14, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 14, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#444';
                    ctx.fillRect(cx + (this.dir > 0 ? 8 : -20), cy - 6, 14, 6);
                    ctx.fillStyle = '#666';
                    ctx.fillRect(cx - 16, cy + 8, 32, 6);
                }
                drawAlien(ctx, cx, cy, bC, hC) {
                    ctx.fillStyle = bC;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 12, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = hC;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 18, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#00ff00';
                    ctx.beginPath();
                    ctx.arc(cx - 3, cy - 20, 3, 0, Math.PI * 2);
                    ctx.arc(cx + 3, cy - 20, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = bC;
                    for (let i = 0; i < 4; i++) {
                        const tentY = cy + 5 + i * 5;
                        ctx.fillRect(cx - 14 + Math.sin(this.animPhase + i) * 4, tentY, 6, 4);
                        ctx.fillRect(cx + 8 - Math.sin(this.animPhase + i) * 4, tentY, 6, 4);
                    }
                    ctx.fillStyle = '#ff00ff';
                    ctx.fillRect(cx - 1, cy + 15, 3, 6);
                }
            }

            // ============================================================
            // BOSS CLASS
            // ============================================================
            class Boss {
                constructor(x, y, level) {
                    this.x = x;
                    this.y = y;
                    this.level = level;
                    this.alive = true;
                    this.bossIndex = Math.floor(level / 10) - 1;
                    this.phase = 0;
                    this.animPhase = 0;
                    this.shootTimer = 60;
                    this.attackPattern = 0;
                    this.attackTimer = 0;
                    this.flashTimer = 0;
                    this.setupStats();
                    this.vy = 0;
                    this.grounded = false;
                    this.tentacles = [];
                    for (let i = 0; i < 8; i++) {
                        this.tentacles.push({ phase: i * 0.7, len: 30 + Math.random() * 40, angle: i * Math.PI / 4 });
                    }
                }
                setupStats() {
                    const lvl = this.level;
                    switch (this.bossIndex) {
                        case 0:
                            this.name = 'EYE STALKER';
                            this.hp = 40 + Math.floor(lvl * 0.5);
                            this.width = 70;
                            this.height = 70;
                            this.color1 = '#8844cc';
                            this.color2 = '#440088';
                            this.eyeColor = '#ff00ff';
                            this.speed = 0.8;
                            this.bossType = 'eye';
                            break;
                        case 1:
                            this.name = 'TENTACLE HORROR';
                            this.hp = 60 + Math.floor(lvl * 0.6);
                            this.width = 90;
                            this.height = 80;
                            this.color1 = '#448844';
                            this.color2 = '#224422';
                            this.eyeColor = '#88ff00';
                            this.speed = 1.0;
                            this.bossType = 'tentacle';
                            break;
                        case 2:
                            this.name = 'SPORE BEAST';
                            this.hp = 80 + Math.floor(lvl * 0.7);
                            this.width = 80;
                            this.height = 75;
                            this.color1 = '#cc8844';
                            this.color2 = '#884422';
                            this.eyeColor = '#ff8800';
                            this.speed = 1.2;
                            this.bossType = 'spore';
                            break;
                        case 3:
                            this.name = 'WINGED TERROR';
                            this.hp = 100 + Math.floor(lvl * 0.8);
                            this.width = 85;
                            this.height = 70;
                            this.color1 = '#4466cc';
                            this.color2 = '#223388';
                            this.eyeColor = '#44ccff';
                            this.speed = 1.5;
                            this.bossType = 'winged';
                            break;
                        case 4:
                            this.name = 'ALIEN OVERLORD';
                            this.hp = 150 + Math.floor(lvl * 1.0);
                            this.width = 100;
                            this.height = 95;
                            this.color1 = '#cc2244';
                            this.color2 = '#660022';
                            this.eyeColor = '#ff0044';
                            this.speed = 1.8;
                            this.bossType = 'overlord';
                            break;
                        default:
                            this.name = 'ALIEN BOSS';
                            this.hp = 40;
                            this.width = 70;
                            this.height = 70;
                            this.color1 = '#8844cc';
                            this.color2 = '#440088';
                            this.eyeColor = '#ff00ff';
                            this.speed = 0.8;
                            this.bossType = 'eye';
                    }
                    this.maxHp = this.hp;
                }
                update(player, platforms) {
                    this.animPhase += 0.05;
                    if (this.flashTimer > 0) this.flashTimer--;
                    this.attackTimer--;
                    this.shootTimer--;
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (this.bossType === 'winged' || this.bossType === 'overlord') {
                        this.x += (dx > 0 ? 1 : -1) * this.speed * 0.6;
                        this.y += (dy > 30 ? 1 : (dy < -30 ? -1 : 0)) * this.speed * 0.4;
                        this.y = Math.max(80, Math.min(350, this.y));
                    } else if (this.bossType === 'spore') {
                        this.x += (dx > 0 ? 1 : -1) * this.speed * 0.4;
                        this.y = 150 + Math.sin(this.animPhase * 0.8) * 50;
                    } else if (this.bossType === 'eye') {
                        this.y = 120 + Math.sin(this.animPhase * 0.6) * 30;
                        this.x = 3300;
                    } else if (this.bossType === 'tentacle') {
                        this.vy += GRAVITY;
                        this.y += this.vy;
                        if (this.y >= GROUND_Y - this.height / 2) {
                            this.y = GROUND_Y - this.height / 2;
                            this.vy = 0;
                            this.grounded = true;
                        }
                        this.x += (dx > 100 ? 1 : (dx < -100 ? -1 : 0)) * this.speed * 0.5;
                    }
                    this.x = Math.max(3000, Math.min(3900, this.x));
                    if (this.attackTimer <= 0) {
                        this.attackPattern = (this.attackPattern + 1) % 4;
                        this.attackTimer = 120 + Math.random() * 80;
                        if (this.attackPattern === 3) {
                            playSound('bossRoar');
                        }
                    }
                    if (this.shootTimer <= 0) {
                        this.performAttack(player);
                        this.shootTimer = 40 + Math.random() * 60;
                    }
                }
                performAttack(player) {
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const spd = 4 + this.level * 0.06;
                    switch (this.attackPattern) {
                        case 0:
                            for (let i = -2; i <= 2; i++) {
                                const angle = Math.atan2(dy, dx) + i * 0.3;
                                projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * spd, Math.sin(
                                    angle) * spd, false, 1, '#ff4444', 4));
                            }
                            break;
                        case 1:
                            for (let i = 0; i < 6; i++) {
                                const angle = (i / 6) * Math.PI * 2 + this.animPhase;
                                projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * spd * 0.8, Math
                                    .sin(angle) * spd * 0.8, false, 1, '#ff8844', 3.5));
                            }
                            break;
                        case 2:
                            if (this.bossType === 'tentacle') {
                                projectiles.push(new Projectile(this.x, this.y - 10, -spd * 0.7, -spd * 1.2, false, 1,
                                    '#44ff44', 4));
                                projectiles.push(new Projectile(this.x, this.y - 10, spd * 0.7, -spd * 1.2, false, 1,
                                    '#44ff44', 4));
                            } else {
                                for (let i = -1; i <= 1; i++) {
                                    projectiles.push(new Projectile(this.x, this.y, -spd * 0.9, (i * spd * 0.5),
                                        false, 1, '#ff66ff', 3.5));
                                }
                            }
                            break;
                        case 3:
                            for (let i = 0; i < 10; i++) {
                                const angle = Math.random() * Math.PI * 2;
                                const spd2 = spd * (0.4 + Math.random() * 0.6);
                                projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * spd2, Math.sin(
                                    angle) * spd2, false, 1, '#ffffff', 3));
                            }
                            break;
                    }
                }
                takeDamage(dmg) {
                    this.hp -= dmg;
                    this.flashTimer = 10;
                    if (this.hp <= 0) {
                        this.alive = false;
                        spawnExplosion(this.x, this.y, true);
                        spawnExplosion(this.x - 20, this.y - 20, true);
                        spawnExplosion(this.x + 20, this.y + 20, true);
                        playSound('explosion');
                        return true;
                    }
                    playSound('bossHit');
                    if (Math.random() < 0.3) {
                        spawnExplosion(this.x + (Math.random() - 0.5) * 40, this.y + (Math.random() - 0.5) * 40,
                            false);
                    }
                    return false;
                }
                getHitbox() {
                    return { x: this.x - this.width / 2, y: this.y - this.height / 2, w: this.width, h: this.height };
                }
                draw(ctx) {
                    const cx = this.x;
                    const cy = this.y;
                    const flash = this.flashTimer > 0;
                    ctx.save();
                    ctx.globalAlpha = flash ? 0.85 : 1;
                    const c1 = flash ? '#fff' : this.color1;
                    const c2 = flash ? '#fff' : this.color2;
                    const eyeC = flash ? '#fff' : this.eyeColor;
                    switch (this.bossType) {
                        case 'eye':
                            this.drawEyeStalker(ctx, cx, cy, c1, c2, eyeC);
                            break;
                        case 'tentacle':
                            this.drawTentacleHorror(ctx, cx, cy, c1, c2, eyeC);
                            break;
                        case 'spore':
                            this.drawSporeBeast(ctx, cx, cy, c1, c2, eyeC);
                            break;
                        case 'winged':
                            this.drawWingedTerror(ctx, cx, cy, c1, c2, eyeC);
                            break;
                        case 'overlord':
                            this.drawOverlord(ctx, cx, cy, c1, c2, eyeC);
                            break;
                    }
                    ctx.globalAlpha = 1;
                    ctx.restore();
                    const hpW = 120;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(cx - hpW / 2, cy - this.height / 2 - 20, hpW, 14);
                    ctx.fillStyle = this.hp / this.maxHp > 0.5 ? '#00ff44' :
                        this.hp / this.maxHp > 0.25 ? '#ffaa00' : '#ff3333';
                    ctx.fillRect(cx - hpW / 2 + 2, cy - this.height / 2 - 18, (hpW - 4) * (this.hp / this.maxHp),
                        10);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.name, cx, cy - this.height / 2 - 24);
                    ctx.fillText(this.hp + '/' + this.maxHp, cx, cy - this.height / 2 - 8);
                }
                drawEyeStalker(ctx, cx, cy, c1, c2, eyeC) {
                    ctx.fillStyle = c2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 35, 30, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - 5, 28, 24, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = eyeC;
                    const eyeR = 16 + Math.sin(this.animPhase * 2) * 3;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 5, eyeR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 5, eyeR * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 3, cy - 10, 4, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 5; i++) {
                        const angle = i * Math.PI * 2 / 5 + this.animPhase * 0.5;
                        const sx = cx + Math.cos(angle) * 30;
                        const sy = cy + Math.sin(angle) * 25;
                        ctx.fillStyle = c2;
                        ctx.fillRect(sx - 3, sy - 3, 6, 6);
                        ctx.fillStyle = eyeC;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                drawTentacleHorror(ctx, cx, cy, c1, c2, eyeC) {
                    ctx.fillStyle = c2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - 10, 40, 30, 0, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < this.tentacles.length; i++) {
                        const t = this.tentacles[i];
                        const baseX = cx + Math.cos(t.angle) * 30;
                        const baseY = cy - 10 + Math.sin(t.angle) * 20;
                        const wobble = Math.sin(this.animPhase * 2 + t.phase) * 15;
                        ctx.strokeStyle = c1;
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.moveTo(baseX, baseY);
                        ctx.quadraticCurveTo(baseX + wobble, baseY - t.len * 0.5, baseX + wobble * 1.5, baseY - t
                            .len);
                        ctx.stroke();
                        ctx.fillStyle = eyeC;
                        ctx.beginPath();
                        ctx.arc(baseX + wobble * 1.5, baseY - t.len, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(baseX + wobble * 1.5, baseY - t.len, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - 10, 25, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = eyeC;
                    ctx.beginPath();
                    ctx.arc(cx - 8, cy - 15, 8, 0, Math.PI * 2);
                    ctx.arc(cx + 8, cy - 15, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 8, cy - 15, 4, 0, Math.PI * 2);
                    ctx.arc(cx + 8, cy - 15, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 5, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
                drawSporeBeast(ctx, cx, cy, c1, c2, eyeC) {
                    ctx.fillStyle = c2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 38, 30, 0, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 6; i++) {
                        const angle = i * Math.PI / 3 + this.animPhase * 0.7;
                        const d = 35 + Math.sin(this.animPhase * 1.5 + i) * 8;
                        const sx = cx + Math.cos(angle) * d;
                        const sy = cy + Math.sin(angle) * d;
                        ctx.fillStyle = c1;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = eyeC;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - 5, 25, 20, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = eyeC;
                    const er = 10 + Math.sin(this.animPhase * 3) * 4;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 8, er, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 8, er * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 3, cy - 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                drawWingedTerror(ctx, cx, cy, c1, c2, eyeC) {
                    const wingFlap = Math.sin(this.animPhase * 2) * 20;
                    ctx.fillStyle = c2;
                    ctx.beginPath();
                    ctx.moveTo(cx - 20, cy - 10);
                    ctx.quadraticCurveTo(cx - 50, cy - 40 + wingFlap, cx - 55, cy - 10 + wingFlap);
                    ctx.quadraticCurveTo(cx - 40, cy + 5 + wingFlap, cx - 20, cy + 5);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(cx + 20, cy - 10);
                    ctx.quadraticCurveTo(cx + 50, cy - 40 + wingFlap, cx + 55, cy - 10 + wingFlap);
                    ctx.quadraticCurveTo(cx + 40, cy + 5 + wingFlap, cx + 20, cy + 5);
                    ctx.fill();
                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 25, 22, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = eyeC;
                    ctx.beginPath();
                    ctx.arc(cx - 7, cy - 8, 8, 0, Math.PI * 2);
                    ctx.arc(cx + 7, cy - 8, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 7, cy - 8, 4, 0, Math.PI * 2);
                    ctx.arc(cx + 7, cy - 8, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff8800';
                    ctx.beginPath();
                    ctx.arc(cx, cy + 5, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                drawOverlord(ctx, cx, cy, c1, c2, eyeC) {
                    ctx.fillStyle = c2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 45, 35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 8; i++) {
                        const angle = i * Math.PI / 4 + this.animPhase * 0.5;
                        const d = 40;
                        const sx = cx + Math.cos(angle) * d;
                        const sy = cy + Math.sin(angle) * d;
                        ctx.fillStyle = c1;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 10 + Math.sin(this.animPhase + i) * 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = eyeC;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy - 8, 30, 25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = eyeC;
                    const er = 14 + Math.sin(this.animPhase * 2.5) * 5;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 10, er, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 10, er * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 16, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff00ff';
                    for (let i = 0; i < 6; i++) {
                        const a = i * Math.PI / 3 + this.animPhase;
                        const sx = cx + Math.cos(a) * 25;
                        const sy = cy + 10 + Math.sin(a) * 8;
                        ctx.fillRect(sx - 2, sy - 2, 4, 4);
                    }
                }
            }

            // ============================================================
            // PLAYER CLASS
            // ============================================================
            class Player {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
