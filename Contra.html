                const groundY = game.getGroundY();
                if (this.y + this.h > groundY) {
                    this.y = groundY - this.h;
                    this.vy = 0;
                    this.onGround = true;
                } else {
                    this.onGround = false;
                }

                for (const pl of game.platforms) {
                    if (pl.type === 'ground') continue;
                    if (this.x + this.w > pl.x + 4 && this.x < pl.x + pl.w - 4 &&
                        this.y + this.h > pl.y && this.y + this.h < pl.y + pl.h + 10 &&
                        this.vy >= 0) {
                        this.y = pl.y - this.h;
                        this.vy = 0;
                        this.onGround = true;
                        break;
                    }
                }

                this.animTimer++;
                if (this.animTimer > 10) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                }
                if (Math.abs(this.vx) > 0.3) {
                    this.walkCycle += 0.06;
                }

                if (this.canShoot && this.shootTimer <= 0 && dist < 450) {
                    this.shootTimer = 50 + Math.random() * 60;
                }
                if (this.shootTimer < 0) this.shootTimer = 0;
            }

            draw(ctx, camX) {
                const x = this.x - camX;
                const y = this.y;
                if (x > W + 40 || x < -40) return;

                ctx.save();

                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(x + this.w / 2, y + this.h + 2, 12, 3, 0, 0, 0, Math.PI * 2);
                ctx.fill();

                const f = this.facing;

                if (this.type === 'turret') {
                    ctx.fillStyle = '#3a4a5a';
                    ctx.fillRect(x + 2, y + 4, 18, 18);
                    ctx.fillStyle = '#5a6a7a';
                    ctx.fillRect(x + 4, y + 6, 14, 14);
                    ctx.fillStyle = '#4a5a6a';
                    ctx.save();
                    ctx.translate(x + 11, y + 16);
                    ctx.rotate(0);
                    ctx.fillRect(0, -2, 16 * f, 4);
                    ctx.restore();
                    ctx.fillStyle = '#2a3a4a';
                    ctx.fillRect(x + 2, y + 22, 18, 6);
                    ctx.fillStyle = this.canShoot ? '#ff4444' : '#44ff44';
                    ctx.shadowColor = this.canShoot ? '#ff4444' : '#44ff44';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(x + 11, y + 11, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (this.type === 'runner') {
                    ctx.fillStyle = '#4a1a1a';
                    ctx.fillRect(x + 2, y + 6, 18, 14);
                    ctx.fillStyle = '#6a2a2a';
                    ctx.fillRect(x + 4, y + 8, 14, 10);
                    ctx.fillStyle = '#8a3a3a';
                    const legOff = Math.sin(this.walkCycle) * 4;
                    ctx.fillRect(x + 2, y + 20, 7, 8 + legOff);
                    ctx.fillRect(x + 13, y + 20, 7, 8 - legOff);
                    ctx.fillStyle = '#c08060';
                    ctx.fillRect(x + 4, y + 1, 14, 8);
                    ctx.fillStyle = '#ff2222';
                    ctx.shadowColor = '#ff2222';
                    ctx.shadowBlur = 4;
                    ctx.fillRect(f > 0 ? x + 12 : x + 4, y + 3, 4, 4);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#2a4a2a';
                    ctx.fillRect(x + 2, y + 6, 18, 14);
                    ctx.fillStyle = '#3a6a3a';
                    ctx.fillRect(x + 4, y + 8, 14, 10);
                    ctx.fillStyle = '#2a3a2a';
                    const legOff = Math.sin(this.walkCycle) * 3;
                    ctx.fillRect(x + 2, y + 20, 7, 8 + legOff);
                    ctx.fillRect(x + 13, y + 20, 7, 8 - legOff);
                    ctx.fillStyle = '#d0a880';
                    ctx.fillRect(x + 4, y + 1, 14, 8);
                    ctx.fillStyle = '#3a5a3a';
                    ctx.fillRect(x + 3, y + 0, 16, 4);
                    ctx.fillRect(x + 2, y + 2, 18, 3);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(f > 0 ? x + 12 : x + 4, y + 3, 4, 4);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(f > 0 ? x + 13 : x + 5, y + 3, 2, 2);
                    ctx.fillStyle = '#444';
                    ctx.fillRect(f > 0 ? x + 18 : x - 8, y + 10, 8, 3);
                    ctx.fillStyle = '#666';
                    ctx.fillRect(f > 0 ? x + 22 : x - 10, y + 11, 4, 2);
                }

                if (this.health < this.maxHealth) {
                    const bw = 20;
                    const bh = 3;
                    const bx = x + this.w / 2 - bw / 2;
                    const by = y - 6;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = '#44ff44';
                    ctx.fillRect(bx, by, bw * (this.health / this.maxHealth), bh);
                }

                ctx.restore();
            }
        }

        // ─── Boss Class ──────────────────────────────────────────────────────
        class Boss {
            constructor(x, y, level) {
                this.x = x;
                this.y = y;
                this.level = level;
                this.w = 64;
                this.h = 56;
                this.maxHealth = 30 + level * 2;
                this.health = this.maxHealth;
                this.active = true;
                this.canShoot = true;
                this.shootTimer = 30;
                this.phase = 0;
                this.animFrame = 0;
                this.animTimer = 0;
                this.pattern = 0;
                this.patternTimer = 0;
                this.moveTimer = 0;
                this.targetY = y;
                this.vx = 0;
                this.vy = 0;
                this.facing = -1;
                this.glowTimer = 0;
                this.eyeColor = '#ff2244';
            }

            update(game) {
                if (!this.active) return;
                this.glowTimer += 0.04;
                this.animTimer++;
                if (this.animTimer > 12) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                }

                const p = game.player;
                if (!p || p.dead) return;

                const dx = p.x - this.x;
                this.facing = dx > 0 ? 1 : -1;

                this.moveTimer++;
                this.patternTimer++;

                if (this.patternTimer > 120 + Math.random() * 80) {
                    this.pattern = (this.pattern + 1) % 3;
                    this.patternTimer = 0;
                    this.targetY = 300 + Math.random() * 120;
                }

                if (this.pattern === 0) {
                    const range = 120 + this.level * 1.5;
                    const speed = 0.8 + this.level * 0.03;
                    this.vx = Math.sin(this.moveTimer * 0.02) * speed * 0.8;
                    this.x += this.vx;
                } else if (this.pattern === 1) {
                    if (Math.abs(this.y - this.targetY) > 2) {
                        this.vy = (this.targetY - this.y) * 0.03;
                        this.y += this.vy;
                    }
                    this.vx = (dx > 0 ? 1 : -1) * 0.3;
                    this.x += this.vx;
                } else {
                    const spd = 0.5 + this.level * 0.02;
                    this.vx = (dx > 0 ? 1 : -1) * spd;
                    this.x += this.vx;
                    if (Math.random() < 0.01) {
                        this.targetY = 280 + Math.random() * 120;
                    }
                    if (Math.abs(this.y - this.targetY) > 4) {
                        this.vy = (this.targetY - this.y) * 0.02;
                        this.y += this.vy;
                    }
                }

                if (this.x < 30) this.x = 30;
                if (this.x > game.levelWidth - 30) this.x = game.levelWidth - 30;
                if (this.y < 220) this.y = 220;
                if (this.y > 430) this.y = 430;

                this.shootTimer--;
                if (this.shootTimer <= 0) {
                    this.shootTimer = Math.max(15, 40 - this.level * 0.4);
                    this.canShoot = true;
                } else {
                    this.canShoot = false;
                }

                if (this.health < this.maxHealth * 0.4 && Math.random() < 0.005) {
                    if (game.enemies.length < 6) {
                        const e = new Enemy(
                            this.x + (Math.random() > 0.5 ? 60 : -60),
                            this.y + 20,
                            'soldier',
                            game.difficulty
                        );
                        game.enemies.push(e);
                    }
                }

                const ratio = this.health / this.maxHealth;
                if (ratio > 0.6) this.eyeColor = '#ff2244';
                else if (ratio > 0.3) this.eyeColor = '#ff6622';
                else this.eyeColor = '#ffaa22';
            }

            draw(ctx, camX) {
                if (!this.active) return;
                const x = this.x - camX;
                const y = this.y;
                if (x > W + 60 || x < -60) return;

                ctx.save();

                const grad = ctx.createRadialGradient(x + 32, y + 28, 10, x + 32, y + 28, 60);
                grad.addColorStop(0, `rgba(255,50,80,${0.1 + 0.05 * Math.sin(this.glowTimer)})`);
                grad.addColorStop(1, 'rgba(255,50,80,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x + 32, y + 28, 60, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(x + 32, y + 56, 34, 6, 0, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 15;

                const grad2 = ctx.createRadialGradient(x + 22, y + 16, 5, x + 32, y + 28, 34);
                grad2.addColorStop(0, '#4a2a6a');
                grad2.addColorStop(0.5, '#2a1a4a');
                grad2.addColorStop(1, '#1a0a2a');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.ellipse(x + 32, y + 30, 32, 26, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(120,60,200,${0.3 + 0.15 * Math.sin(this.glowTimer)})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(x + 32, y + 30, 32, 26, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#3a1a5a';
                ctx.beginPath();
                ctx.ellipse(x + 32, y + 16, 22, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 20;
                ctx.shadowColor = this.eyeColor;
                for (let i = -1; i <= 1; i += 2) {
                    ctx.fillStyle = this.eyeColor;
                    ctx.beginPath();
                    ctx.ellipse(x + 32 + i * 12, y + 14, 8, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(x + 32 + i * 12 + (this.facing > 0 ? 4 : -4), y + 15, 4, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(x + 32 + i * 12 + (this.facing > 0 ? 5 : -3), y + 12, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#1a0a2a';
                ctx.fillRect(x + 22, y + 20, 20, 8);
                ctx.fillStyle = '#4a2a6a';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(x + 24 + i * 5, y + 21, 3, 5);
                }
                ctx.fillStyle = '#6a3a8a';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#aa44ff';
                ctx.beginPath();
                ctx.ellipse(x + 32 + Math.sin(this.glowTimer * 1.5) * 5, y + 30, 5, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = '#4a2a6a';
                ctx.lineWidth = 5;
                for (let i = -1; i <= 1; i += 2) {
                    ctx.beginPath();
                    ctx.moveTo(x + 32 + i * 28, y + 24);
                    const wave = Math.sin(this.glowTimer * 0.6 + i * 2) * 5;
                    ctx.quadraticCurveTo(
                        x + 32 + i * 44,
                        y + 34 + wave,
                        x + 32 + i * 50,
                        y + 50 + wave * 0.5
                    );
                    ctx.stroke();
                    ctx.fillStyle = '#6a3a8a';
                    ctx.beginPath();
                    ctx.arc(x + 32 + i * 50, y + 50 + wave * 0.5, 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#5a3a7a';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#8844aa';
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + this.glowTimer * 0.1;
                    const sx = x + 32 + Math.cos(angle) * 34;
                    const sy = y + 30 + Math.sin(angle) * 28;
                    ctx.beginPath();
                    ctx.moveTo(sx - 5, sy - 5);
                    ctx.lineTo(sx + Math.cos(angle) * 10, sy + Math.sin(angle) * 10);
                    ctx.lineTo(sx + 5, sy - 5);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                const ratio = this.health / this.maxHealth;
                ctx.strokeStyle = `rgba(255,50,80,${0.2 + 0.3 * ratio})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 7]);
                ctx.beginPath();
                ctx.arc(x + 32, y + 30, 38, 0, Math.PI * 2 * ratio);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.restore();
            }
        }

        // ─── Start ────────────────────────────────────────────────────────────
        overlayTitle.textContent = '🎮 CONTRA';
        overlaySub.textContent = '▶ 50 LEVELS · 5 BOSSES';
        overlayMsg.textContent = 'Touch controls or keyboard · 5 lives · Bomb & Roll';
        actionBtn.textContent = 'START GAME';
        overlay.classList.add('show');
        actionBtn.onclick = () => {
            overlay.classList.remove('show');
            game.init();
        };

        game.player = new Player(80, 360);
        game.generateLevel(1);
        game.state = 'menu';

        function resizeCanvas() {
            const wrapper = document.getElementById('gameWrapper');
            const maxW = window.innerWidth - 10;
            const maxH = window.innerHeight - 10;
            const ratio = 900 / 500;
            let w = Math.min(maxW, 920);
            let h = w / ratio;
            if (h > maxH) { h = maxH;
                w = h * ratio; }
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        game.loop();
        console.log('🎮 CONTRA - Full version with touch, bomb, roll, human player');
        console.log('Controls: ← → move, W/space jump, S crouch, ↓ lay, J shoot, B bomb, R roll');
    </script>
